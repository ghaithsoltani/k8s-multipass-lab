apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  app.properties: |
    environment=production
    log_level=info
    max_connections=100
  nginx.conf: |
    server {
      listen 80;
      location / {
        return 200 'Hello from ConfigMap config file!';
        add_header Content-Type text/plain;
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  db_password: supersecret123
  api_key: myapikey456
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-demo
  template:
    metadata:
      labels:
        app: config-demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: app-config
          items:
          - key: nginx.conf
            path: default.conf
      - name: secret-volume
        secret:
          secretName: app-secret
---
apiVersion: v1
kind: Service
metadata:
  name: config-demo-service
spec:
  selector:
    app: config-demo
  ports:
  - port: 80
    targetPort: 80
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30090
