apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api
        image: nginx:1.25
        ports:
        - containerPort: 80
        env:
        - name: MONGO_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGO_HOST
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGO_USERNAME
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: API_KEY
        volumeMounts:
        - name: api-html
          mountPath: /usr/share/nginx/html
      initContainers:
      - name: init
        image: busybox
        command:
        - sh
        - -c
        - echo "<h1>API Service</h1><p>Connected to $(MONGO_HOST)</p>" > /html/index.html
        volumeMounts:
        - name: api-html
          mountPath: /html
      volumes:
      - name: api-html
        emptyDir: {}
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: microservices
spec:
  selector:
    app: api-service
  ports:
  - port: 3000
    targetPort: 80
